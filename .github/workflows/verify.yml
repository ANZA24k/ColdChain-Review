name: Contract and shipment comparison checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser comparison regression checks
        run: |
          npx vite --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          node --experimental-strip-types scripts/check-comparison.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-validation
          path: docs/milestone-v1/
